<div class="bg-white rounded-lg shadow p-4 flex items-center" *ngIf="person">
  <div class="w-16 h-16 rounded-full overflow-hidden mr-4">
    <img [src]="profileImage" alt="Profile picture" class="w-full h-full object-cover" 
         onerror="this.src='assets/images/default-profile.jpg'">
  </div>
  <div>
    <h3 class="font-medium text-gray-800">{{ displayName }}</h3>
    <p class="text-sm text-gray-600">{{ staffRole }}</p>
  </div>
</div>
