<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Ajouter une formation</h2>
                <button 
                    (click)="closePopup()"
                    class="text-gray-500 hover:text-gray-700 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <form (ngSubmit)="submitFormation()">
                <!-- Titre -->
                <div class="mb-4">
                    <label for="titre" class="block text-sm font-medium text-gray-700 mb-1">Titre de la formation *</label>
                    <input 
                        type="text" 
                        id="titre" 
                        name="titre" 
                        [(ngModel)]="formation.titre"
                        class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#E40046] focus:border-[#E40046]"
                        placeholder="Ex: Développeur Web Full Stack">
                </div>
                
                <!-- Description -->
                <div class="mb-4">
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
                    <textarea 
                        id="description" 
                        name="description" 
                        [(ngModel)]="formation.description"
                        rows="3"
                        class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#E40046] focus:border-[#E40046]"
                        placeholder="Décrivez le contenu et les objectifs de la formation..."></textarea>
                </div>
                
                <!-- Durée et Niveau -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="duree" class="block text-sm font-medium text-gray-700 mb-1">Durée (en mois) *</label>
                        <input 
                            type="number" 
                            id="duree" 
                            name="duree" 
                            [(ngModel)]="formation.duree"
                            min="1"
                            max="24"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#E40046] focus:border-[#E40046]">
                    </div>
                    <div>
                        <label for="niveau" class="block text-sm font-medium text-gray-700 mb-1">Niveau *</label>
                        <select 
                            id="niveau" 
                            name="niveau" 
                            [(ngModel)]="formation.niveau"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#E40046] focus:border-[#E40046]">
                            <option *ngFor="let niveau of niveaux" [value]="niveau">{{ niveau }}</option>
                        </select>
                    </div>
                </div>
                
                <!-- Technologies -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Technologies *</label>
                    <div class="flex items-center">
                        <div class="relative flex-1">
                            <input 
                                type="text" 
                                [(ngModel)]="technoInput"
                                name="technoInput"
                                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#E40046] focus:border-[#E40046]"
                                placeholder="Ajouter une technologie..."
                                (keyup.enter)="addTechno()">
                            
                            <!-- Suggestions -->
                            <div *ngIf="filteredTechnoSuggestions.length > 0" class="absolute z-10 w-full mt-1 bg-white shadow-lg rounded-md border border-gray-200 max-h-60 overflow-auto">
                                <div 
                                    *ngFor="let techno of filteredTechnoSuggestions" 
                                    class="px-4 py-2 hover:bg-gray-100 cursor-pointer"
                                    (click)="selectTechnoSuggestion(techno)">
                                    {{ techno }}
                                </div>
                            </div>
                        </div>
                        <button 
                            type="button"
                            (click)="addTechno()"
                            class="ml-2 px-4 py-2 bg-[#E40046] text-white rounded-md hover:bg-[#c8003e] focus:outline-none">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    
                    <!-- Liste des technologies ajoutées -->
                    <div class="flex flex-wrap gap-2 mt-3">
                        <div 
                            *ngFor="let techno of formation.technos" 
                            class="px-3 py-1 bg-gray-100 text-gray-800 text-sm font-medium rounded-full flex items-center">
                            {{ techno }}
                            <button 
                                type="button"
                                (click)="removeTechno(techno)"
                                class="ml-2 text-gray-500 hover:text-gray-700 focus:outline-none">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Image URL -->
                <div class="mb-4">
                    <label for="image" class="block text-sm font-medium text-gray-700 mb-1">URL de l'image</label>
                    <input 
                        type="text" 
                        id="image" 
                        name="image" 
                        [(ngModel)]="formation.image"
                        class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#E40046] focus:border-[#E40046]"
                        placeholder="https://example.com/image.jpg">
                    <p class="text-xs text-gray-500 mt-1">Laissez vide pour utiliser l'image par défaut</p>
                </div>
                
                <!-- Popularité -->
                <div class="mb-6">
                    <label for="popularite" class="block text-sm font-medium text-gray-700 mb-1">Popularité (1-5)</label>
                    <input 
                        type="range" 
                        id="popularite" 
                        name="popularite" 
                        [(ngModel)]="formation.popularite"
                        min="1" 
                        max="5" 
                        step="0.1"
                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    <div class="flex justify-between text-xs text-gray-500 mt-1">
                        <span>1</span>
                        <span>2</span>
                        <span>3</span>
                        <span>4</span>
                        <span>5</span>
                    </div>
                    <p class="text-center mt-2">{{ formation.popularite.toFixed(1) }}</p>
                </div>
                
                <!-- Boutons d'action -->
                <div class="flex justify-end space-x-3">
                    <button 
                        type="button"
                        (click)="closePopup()"
                        class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#E40046]">
                        Annuler
                    </button>
                    <button 
                        type="submit"
                        [disabled]="!isFormValid()"
                        [ngClass]="{'bg-[#E40046] hover:bg-[#c8003e]': isFormValid(), 'bg-gray-300 cursor-not-allowed': !isFormValid()}"
                        class="px-4 py-2 rounded-md shadow-sm text-sm font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#E40046]">
                        Ajouter la formation
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
